name: RADAR v0.4.7.28 genre reset and resilient detection
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.28 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.27 Cloud';" not in s: raise SystemExit('version mismatch')
          # Start genre empty instead of preloading Melodic Techno.
          s=s.replace('id="genre" value="Melodic Techno"','id="genre" value=""',1)
          # If markup used a bare value, cover that exact variant too.
          s=s.replace('id="genre" value=\'Melodic Techno\'','id="genre" value=""',1)
          # Add a safe web-evidence fallback when Spotify artist genres are empty/deprecated.
          old="return json({track:String(td.name||'').trim(),artist:names.join(', '),image:String((td.album&&td.album.images&&td.album.images[0]&&td.album.images[0].url)||d.thumbnail_url||''),spotifyUrl:clean,trackId:parts[1],genres})"
          new="if(!genres.length&&names.length){try{const qs=[names[0]+' '+String(td.name||'')+' genre',names[0]+' music genre'];for(const q of qs){const rr=await braveSearch(q,env,4);const text=(rr||[]).map(x=>String((x.title||'')+' '+(x.description||'')+' '+(x.snippet||''))).join(' ').toLowerCase();const catalog=['melodic techno','melodic house','progressive house','tech house','deep house','afro house','house','techno','trance','electronic','dance pop','pop','hip hop','rap','indie'];for(const g of catalog){if(text.includes(g)&&!genres.includes(g))genres.push(g)}if(genres.length)break}}catch(e){}}return json({track:String(td.name||'').trim(),artist:names.join(', '),image:String((td.album&&td.album.images&&td.album.images[0]&&td.album.images[0].url)||d.thumbnail_url||''),spotifyUrl:clean,trackId:parts[1],genres:genres.slice(0,4)})"
          if old not in s: raise SystemExit('genre response anchor mismatch')
          s=s.replace(old,new,1)
          # Always clear old auto-detection note when a new track resolves without evidence.
          oldclient="const g=$('#genre');if(g&&d.genres&&d.genres.length){const detected=d.genres[0];if(!g.value.trim())g.value=detected;let note=$('#genreDetected');if(!note){note=document.createElement('div');note.id='genreDetected';note.style.cssText='font-size:11px;color:var(--green);margin-top:6px';g.parentNode.appendChild(note)}note.textContent='Rilevato automaticamente: '+d.genres.join(' · ')}"
          newclient="const g=$('#genre');let note=$('#genreDetected');if(note)note.remove();if(g&&d.genres&&d.genres.length){const detected=d.genres[0];if(!g.dataset.userEdited)g.value=detected;note=document.createElement('div');note.id='genreDetected';note.style.cssText='font-size:11px;color:var(--green);margin-top:6px';note.textContent='Rilevato automaticamente: '+d.genres.join(' · ');g.parentNode.appendChild(note)}"
          if oldclient not in s: raise SystemExit('genre client anchor mismatch')
          s=s.replace(oldclient,newclient,1)
          # Preserve a manual genre choice after user edits it.
          marker="setTimeout(()=>{const el=$('#trackUrl');if(el){el.addEventListener('input'"
          if marker not in s: raise SystemExit('listener marker mismatch')
          s=s.replace(marker,"setTimeout(()=>{const gg=$('#genre');if(gg)gg.addEventListener('input',()=>{gg.dataset.userEdited='1'});const el=$('#trackUrl');if(el){el.addEventListener('input'",1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.27 Cloud';","const VERSION = 'RADAR v0.4.7.28 Cloud';",1)
          if '<div class="version">v0.4.7.27</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.27</div>','<div class="version">v0.4.7.28</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.28 Cloud","id=\"trackUrl\"","id=\"trackPreview\"","Rilevato automaticamente:","melodic techno","dataset.userEdited","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if 'id="genre" value="Melodic Techno"' in s: raise SystemExit('default genre still present')
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.28 genre reset and resilient detection" || exit 0
          git push
