name: RADAR v0.4.7.11
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Spotify evidence priority
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          changes=[
            ("function guessCuratorName(playlistName,results){","function guessCuratorName(playlistName,results,spotifyUrl){"),
            ("  const p=normalize(playlistName),rows=Array.isArray(results)?results:[],hits=[];","  const p=normalize(playlistName),rows=Array.isArray(results)?results:[],hits=[];\n  const spotifyId=(String(spotifyUrl||'').match(/open\\.spotify\\.com\\/playlist\\/([A-Za-z0-9]+)/i)||[])[1]||'';"),
            ("  const add=(name,row,strongTitle)=>{name=clean(name);if(valid(name))hits.push({name,row,strongTitle:!!strongTitle,source:sourceKey(row)})};","  const exactSpotifyRow=r=>!!spotifyId&&new RegExp('open\\\\.spotify\\\\.com/playlist/'+spotifyId,'i').test(String(r.url||''));\n  const add=(name,row,strongTitle)=>{name=clean(name);if(valid(name))hits.push({name,row,strongTitle:!!strongTitle,source:sourceKey(row),spotifyExact:exactSpotifyRow(row)})};"),
            ("    if(!groups.has(key))groups.set(key,{name:h.name,strongTitle:false,sources:new Set(),playlistSources:new Set()});","    if(!groups.has(key))groups.set(key,{name:h.name,strongTitle:false,spotifyExact:false,sources:new Set(),playlistSources:new Set()});"),
            ("    const g=groups.get(key);g.strongTitle=g.strongTitle||h.strongTitle;g.sources.add(h.source);","    const g=groups.get(key);g.strongTitle=g.strongTitle||h.strongTitle;g.spotifyExact=g.spotifyExact||h.spotifyExact;g.sources.add(h.source);"),
            ("    score:(g.strongTitle?100:0)+(g.sources.size*30)+(g.playlistSources.size*20)","    score:(g.spotifyExact?220:0)+(g.strongTitle?100:0)+(g.sources.size*30)+(g.playlistSources.size*20)"),
            (")).filter(g=>(g.strongTitle&&g.associated)||(g.independent&&g.associated)).sort((a,b)=>b.score-a.score||a.name.length-b.name.length);","  })).filter(g=>(g.spotifyExact&&g.strongTitle)||(g.strongTitle&&g.associated)||(g.independent&&g.associated)).sort((a,b)=>b.score-a.score||a.name.length-b.name.length);"),
            ("curator:guessCuratorName(c.name,results),searchSources:","curator:guessCuratorName(c.name,results,c.spotifyUrl),searchSources:"),
            ("const VERSION = 'RADAR v0.4.7.10 Cloud';","const VERSION = 'RADAR v0.4.7.11 Cloud';"),
            ('<div class="version">v0.4.7.10</div>','<div class="version">v0.4.7.11</div>')
          ]
          for old,new in changes:
            if old not in s:
              raise SystemExit('Expected marker not found: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.11 Cloud" worker.js
          grep -q "guessCuratorName(c.name,results,c.spotifyUrl)" worker.js
          grep -q "spotifyExact" worker.js
          grep -q '<div class="version">v0.4.7.11</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.11 Spotify evidence priority" || exit 0
          git push
