name: RADAR v0.4.7.38 public placement scan
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.38 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.37 Cloud';" not in s: raise SystemExit('version mismatch')
          old='<div class="status" style="margin-top:9px">In questa versione il pulsante valida il brano. La ricerca placement viene collegata nel prossimo step.</div>'
          new='<div class="status" style="margin-top:9px">Cerca placement pubblicamente rilevabili sul web. I risultati non rappresentano tutte le playlist Spotify.</div><div id="trackRadarResults" style="margin-top:14px"></div>'
          if old not in s: raise SystemExit('result shell anchor mismatch')
          s=s.replace(old,new,1)
          backend="""
async function trackRadarScan(input,env){
  const track=String(input?.track||'').trim(), artist=String(input?.artist||'').trim(), trackId=String(input?.trackId||'').trim();
  if(!track||!artist)throw new Error('Metadati brano mancanti');
  const queries=['"'+track+'" "'+artist+'" site:open.spotify.com/playlist','"'+artist+'" "'+track+'" Spotify playlist'];
  if(trackId)queries.push('"'+trackId+'" site:open.spotify.com/playlist');
  const batches=await Promise.all(queries.map(q=>smartSearch(q,env,12)));
  const rows=batches.flatMap(x=>x.results||[]), map=new Map();
  for(const r of rows){
    const text=normalize((r.title||'')+' '+(r.description||'')+' '+(r.url||''));
    const hasTrack=text.includes(normalize(track)), hasArtist=text.includes(normalize(artist));
    if(!hasTrack||!hasArtist)continue;
    const clean=cleanPlaylistUrl(r.url||''); if(!clean)continue;
    const m=clean.match(/open\\.spotify\\.com\\/playlist\\/([A-Za-z0-9]+)/i); if(!m)continue;
    const id=m[1], prev=map.get(id), evidence=String((r.title||'')+' — '+(r.description||'')).trim();
    const item={playlistId:id,spotifyUrl:clean,name:String(r.title||'Spotify playlist').replace(/\\s*[-|]\\s*Spotify.*$/i,'').trim(),confidence:'confirmed',evidence:evidence.slice(0,280)};
    if(!prev||item.evidence.length>prev.evidence.length)map.set(id,item);
  }
  const placements=[];
  for(const item of [...map.values()].slice(0,20)){
    try{const ident=await spotifyPlaylistIdentity(item.spotifyUrl,env);if(ident){item.name=ident.name||item.name;item.owner=ident.owner||''}}catch(e){}
    placements.push(item);
  }
  return{track,artist,trackId,placements,queries:queries.length,notice:'Risultati basati su evidenze web pubbliche indicizzate; non sono una lista completa di Spotify.'};
}
"""
          route="if(url.pathname==='/api/track-radar'&&request.method==='POST'){try{return json(await trackRadarScan(await request.json(),env))}catch(e){return json({error:e.message||'Errore Track Radar'},500)}}\n"
          export_anchor="export default {async fetch(request,env){const url=new URL(request.url);"
          if export_anchor not in s: raise SystemExit('export anchor mismatch')
          s=s.replace(export_anchor,backend+'\n'+export_anchor+route,1)
          js_anchor="setTimeout(()=>{const el=$('#trackRadarUrl');if(el){el.addEventListener('input',()=>{clearTimeout(el._tr);el._tr=setTimeout(resolveTrackRadar,220)});el.addEventListener('paste',()=>setTimeout(resolveTrackRadar,30))}},0);"
          js_add=js_anchor+"\nasync function scanTrackRadarPlacements(){const btn=$('#trackRadarScan'),status=$('#trackRadarStatus'),box=$('#trackRadarResults');if(!trackRadarMeta||!btn||!status||!box)return;btn.disabled=true;status.textContent='Scansione placement pubblici…';box.innerHTML='';try{const r=await fetch('/api/track-radar',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({track:trackRadarMeta.track,artist:trackRadarMeta.artist,trackId:trackRadarMeta.trackId})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Errore scansione');const list=Array.isArray(d.placements)?d.placements:[];status.textContent=list.length?('Placement confermati: '+list.length):'Nessun placement pubblico confermato trovato.';if(!list.length){box.innerHTML='<div class=\"empty\">Nessun placement verificabile nelle pagine pubbliche indicizzate.</div>';return}for(const x of list){const card=document.createElement('div');card.className='result';const h=document.createElement('h3');h.textContent=x.name||'Spotify playlist';const meta=document.createElement('div');meta.className='muted';meta.textContent='🟢 CONFERMATO'+(x.owner?' · '+x.owner:'');const ev=document.createElement('div');ev.className='muted';ev.style.marginTop='6px';ev.textContent=x.evidence||'Titolo e artista rilevati in evidenza pubblica indicizzata.';const a=document.createElement('a');a.href=x.spotifyUrl;a.target='_blank';a.rel='noopener';a.className='btn secondary';a.style.cssText='display:inline-block;margin-top:10px;text-decoration:none';a.textContent='Apri Spotify';card.append(h,meta,ev,a);box.appendChild(card)}}catch(e){status.textContent=e.message||'Errore Track Radar';box.innerHTML='<div class=\"empty\">Scansione non completata.</div>'}finally{btn.disabled=!trackRadarMeta}}\ndocument.addEventListener('click',function(e){if(e.target&&e.target.id==='trackRadarScan')scanTrackRadarPlacements()});"
          if js_anchor not in s: raise SystemExit('track JS anchor mismatch')
          s=s.replace(js_anchor,js_add,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.37 Cloud';","const VERSION = 'RADAR v0.4.7.38 Cloud';",1)
          if '<div class="version">v0.4.7.37</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.37</div>','<div class="version">v0.4.7.38</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Rendered browser syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no rendered scripts')
          Path('/tmp/rendered-client.js').write_text('\n;\n'.join(x.replace('\\\\','\\') for x in scripts))
          PY
          node --check /tmp/rendered-client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.38 Cloud","async function trackRadarScan(input,env)","/api/track-radar","async function scanTrackRadarPlacements()","id=\"trackRadarResults\"","🟢 CONFERMATO","smartSearch(q,env,12)","function setRadarView(view)","id=\"stopScan\" type=\"button\" disabled","new AbortController()","Inserisci il genere musicale prima di avviare RADAR.","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.38 public placement scan" || exit 0
          git push
