name: RADAR v0.4.7.30 genre specificity and track-first UI
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.30 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.29 Cloud';" not in s: raise SystemExit('version mismatch')
          old="for(const g of catalog){let pos=0,start=0;while((pos=text.indexOf(g,start))>=0){scores.set(g,(scores.get(g)||0)+1);start=pos+g.length}}"
          new="const specificHits=catalog.filter(g=>g.includes(' ')&&text.includes(g));for(const g of catalog){if((g==='house'||g==='techno')&&specificHits.some(x=>x.endsWith(g)))continue;let pos=0,start=0;const weight=g.includes(' ')?3:1;while((pos=text.indexOf(g,start))>=0){scores.set(g,(scores.get(g)||0)+weight);start=pos+g.length}}"
          if old not in s: raise SystemExit('genre scoring anchor mismatch')
          s=s.replace(old,new,1)
          css=".field:has(#trackUrl){order:-2}.field:has(#genre){order:-1}"
          anchor='@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}'
          if anchor not in s: raise SystemExit('css anchor mismatch')
          s=s.replace(anchor,css+anchor,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.29 Cloud';","const VERSION = 'RADAR v0.4.7.30 Cloud';",1)
          if '<div class="version">v0.4.7.29</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.29</div>','<div class="version">v0.4.7.30</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.30 Cloud","id=\"trackUrl\"","id=\"trackPreview\"","id=\"genre\" value=\"\"","specificHits","g.includes(' ')?3:1",".field:has(#trackUrl){order:-2}","genreConfidence","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if 'id="genre" value="melodic techno"' in s.lower(): raise SystemExit('genre default still present')
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.30 genre specificity and track-first UI" || exit 0
          git push
