name: RADAR v0.4.7.33 stop search only
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.33 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.32 Cloud';" not in s: raise SystemExit('version mismatch')
          old='<div class="actions"><button class="btn" id="discover" data-i18n="scan">Scansiona playlist</button><button class="btn secondary" id="health" data-i18n="health">Test sistema</button>'
          new='<div class="actions"><button class="btn" id="discover" data-i18n="scan">Scansiona playlist</button><button class="btn secondary" id="stopScan" style="display:none" type="button">Stop ricerca</button><button class="btn secondary" id="health" data-i18n="health">Test sistema</button>'
          if old not in s: raise SystemExit('actions anchor mismatch')
          s=s.replace(old,new,1)
          old2="async function discover(){\n  const genreField=$('#genre');const genreValue=genreField.value.trim();"
          new2="let radarAbortController=null;\nasync function discover(){\n  const genreField=$('#genre');const genreValue=genreField.value.trim();"
          if old2 not in s: raise SystemExit('discover start mismatch')
          s=s.replace(old2,new2,1)
          old3="  const b=$('#discover');b.disabled=true;\n  const payload="
          new3="  const b=$('#discover');b.disabled=true;const stopBtn=$('#stopScan');if(stopBtn)stopBtn.style.display='inline-flex';radarAbortController=new AbortController();\n  const payload="
          if old3 not in s: raise SystemExit('discover button mismatch')
          s=s.replace(old3,new3,1)
          s=s.replace("fetch('/api/discover-base',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})","fetch('/api/discover-base',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:radarAbortController.signal})",1)
          s=s.replace("fetch('/api/contact-enrich',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,candidates:chunk,googleSlots:remainingGoogle})})","fetch('/api/contact-enrich',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,candidates:chunk,googleSlots:remainingGoogle}),signal:radarAbortController.signal})",1)
          old4="  }catch(e){\n    scanError(e.message);\n    $('#results').innerHTML='<div class=\"empty error\">'+esc(e.message)+'</div>';\n    $('#status').textContent=t('error')+': '+e.message;\n  }finally{b.disabled=false}\n}\n\n$('#discover').addEventListener('click',discover);"
          new4="  }catch(e){\n    if(e&&e.name==='AbortError'){clearInterval(scanClock);scanClock=null;$('#scanPanel').classList.remove('active');$('#status').textContent='Ricerca interrotta.';}else{scanError(e.message);$('#results').innerHTML='<div class=\"empty error\">'+esc(e.message)+'</div>';$('#status').textContent=t('error')+': '+e.message;}\n  }finally{b.disabled=false;if(stopBtn)stopBtn.style.display='none';radarAbortController=null}\n}\n\n$('#discover').addEventListener('click',discover);\n$('#stopScan').addEventListener('click',()=>{if(radarAbortController)radarAbortController.abort();});"
          if old4 not in s: raise SystemExit('discover tail mismatch')
          s=s.replace(old4,new4,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.32 Cloud';","const VERSION = 'RADAR v0.4.7.33 Cloud';",1)
          if '<div class="version">v0.4.7.32</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.32</div>','<div class="version">v0.4.7.33</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.33 Cloud","id=\"stopScan\"","new AbortController()","signal:radarAbortController.signal","name==='AbortError'","Inserisci il genere musicale prima di avviare RADAR.","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if '/api/contact-memory' in s: raise SystemExit('contact memory must not be in this version')
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.33 stop search only" || exit 0
          git push
