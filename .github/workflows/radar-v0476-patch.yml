name: RADAR v0.4.7.18
'on':
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parallelize contact enrichment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='\n'.join([
            "  let slots=Math.max(0,Math.min(3,Number(input.googleSlots||0)));",
            "  let googleUsed=0;",
            "  const results=[];",
            "  for(const c of candidates){",
            "    const pack=await deepContactForCandidate(c,input,env,slots>0);",
            "    results.push(pack.result);",
            "    if(pack.googleUsed){googleUsed+=pack.googleUsed;slots-=pack.googleUsed}",
            "  }",
            "  return{braveConfigured:!!env.BRAVE_API_KEY,tavilyConfigured:!!env.TAVILY_API_KEY,serpapiConfigured:!!env.SERPAPI_KEY,googleUsed,results,providers:providerStatus(env)};"
          ])
          new='\n'.join([
            "  const slots=Math.max(0,Math.min(3,Number(input.googleSlots||0)));",
            "  const packs=await Promise.all(candidates.map((c,i)=>deepContactForCandidate(c,input,env,i<slots)));",
            "  const results=packs.map(pack=>pack.result);",
            "  const googleUsed=packs.reduce((n,pack)=>n+Number(pack.googleUsed||0),0);",
            "  return{braveConfigured:!!env.BRAVE_API_KEY,tavilyConfigured:!!env.TAVILY_API_KEY,serpapiConfigured:!!env.SERPAPI_KEY,googleUsed,results,providers:providerStatus(env)};"
          ])
          if old not in s: raise SystemExit('enrichContactBatch marker mismatch')
          s=s.replace(old,new,1)
          if "const VERSION = 'RADAR v0.4.7.17 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.17 Cloud';","const VERSION = 'RADAR v0.4.7.18 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.17</div>','<div class="version">v0.4.7.18</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.18 Cloud" worker.js
          grep -q "Promise.all(candidates.map" worker.js
          grep -q "packs.reduce" worker.js
          grep -q "opportunityScore" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "contactConfidenceBadge" worker.js
          grep -q "contactEvidence(results,primaryName,playlistName='')" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.18</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.18 parallel contact enrichment" || exit 0
          git push
