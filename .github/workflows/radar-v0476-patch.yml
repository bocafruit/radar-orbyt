name: RADAR v0.4.7.34 visible stop control fix
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.34 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.33 Cloud';" not in s: raise SystemExit('version mismatch')
          old='<button class="btn secondary" id="stopScan" style="display:none" type="button">Stop ricerca</button>'
          new='<button class="btn secondary" id="stopScan" type="button" disabled>Stop ricerca</button>'
          if old not in s: raise SystemExit('stop button anchor mismatch')
          s=s.replace(old,new,1)
          old2="const stopBtn=$('#stopScan');if(stopBtn)stopBtn.style.display='inline-flex';radarAbortController=new AbortController();"
          new2="const stopBtn=$('#stopScan');if(stopBtn)stopBtn.disabled=false;radarAbortController=new AbortController();"
          if old2 not in s: raise SystemExit('stop activation mismatch')
          s=s.replace(old2,new2,1)
          old3="if(stopBtn)stopBtn.style.display='none';radarAbortController=null"
          new3="if(stopBtn)stopBtn.disabled=true;radarAbortController=null"
          if old3 not in s: raise SystemExit('stop reset mismatch')
          s=s.replace(old3,new3,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.33 Cloud';","const VERSION = 'RADAR v0.4.7.34 Cloud';",1)
          if '<div class="version">v0.4.7.33</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.33</div>','<div class="version">v0.4.7.34</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.34 Cloud","id=\"stopScan\" type=\"button\" disabled","stopBtn.disabled=false","stopBtn.disabled=true","new AbortController()","signal:radarAbortController.signal","name==='AbortError'","Inserisci il genere musicale prima di avviare RADAR.","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          if '/api/contact-memory' in s: raise SystemExit('contact memory must not be in this version')
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.34 visible stop control fix" || exit 0
          git push
