name: RADAR v0.4.7.44 visible raw diagnostics
'on':
  push:
    paths:
      - .github/workflows/radar-v0476-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible raw diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          assert "const VERSION = 'RADAR v0.4.7.43 Cloud';" in s
          old="z.textContent='Diagnostica: '+(dg.rawCount||0)+' risultati grezzi · '+cs.length+' candidati Spotify. '+qs.map(q=>(q.provider||'?')+':'+(q.count||0)).join(' · ')+' | RAW: '+rs.slice(0,5).map((r,i)=>(i+1)+') '+(r.title||'-')+' → '+(r.url||'-')).join(' | ');box.appendChild(z);return"
          new="z.textContent='Diagnostica: '+(dg.rawCount||0)+' risultati grezzi · '+cs.length+' candidati Spotify. '+qs.map(q=>(q.provider||'?')+':'+(q.count||0)).join(' · ');box.appendChild(z);const rs=Array.isArray(dg.rawSample)?dg.rawSample:[];rs.slice(0,8).forEach((r,i)=>{const row=document.createElement('div');row.className='empty';row.style.marginTop='8px';row.style.padding='12px';row.style.fontSize='12px';row.style.textAlign='left';row.style.wordBreak='break-word';row.textContent='RAW '+(i+1)+' — '+(r.title||'-')+' — '+(r.url||'-');box.appendChild(row)});return"
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.43 Cloud';","const VERSION = 'RADAR v0.4.7.44 Cloud';",1)
          assert '<div class="version">v0.4.7.43</div>' in s
          s=s.replace('<div class="version">v0.4.7.43</div>','<div class="version">v0.4.7.44</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression canaries
        shell: bash
        run: |
          node --check worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I); assert scripts
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          checks=['RADAR v0.4.7.44 Cloud',"row.textContent='RAW '",'rawSample','spotifyCandidates','async function trackRadarScan(input,env)',"/api/track-radar",'async function scanTrackRadarPlacements()','function updateClock',"health').addEventListener",'spotifySearchPlaylists','id="stopScan" type="button" disabled']
          missing=[x for x in checks if x not in s]; assert not missing, missing
          PY
          node --check /tmp/client.js
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name bocafruit
          git config user.email chiesastefanojob@gmail.com
          git add worker.js
          git commit -m 'RADAR v0.4.7.44 visible raw diagnostics' || exit 0
          git push
