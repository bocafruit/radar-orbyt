name: RADAR v0.4.7.32 genre required only
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.32 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.31 Cloud';" not in s: raise SystemExit('version mismatch')
          old="async function discover(){\n  const b=$('#discover');b.disabled=true;\n  const payload={genre:$('#genre').value.trim(),artists:$('#artists').value.trim(),mode:$('#mode').value,strategy:$('#strategy').value,objective:$('#objective').value};"
          new="async function discover(){\n  const genreField=$('#genre');const genreValue=genreField.value.trim();\n  if(!genreValue){genreField.focus();const oldBorder=genreField.style.borderColor;genreField.style.borderColor='#ff5b6e';$('#status').textContent='Inserisci il genere musicale prima di avviare RADAR.';setTimeout(()=>{genreField.style.borderColor=oldBorder},1800);return;}\n  const b=$('#discover');b.disabled=true;\n  const payload={genre:genreValue,artists:$('#artists').value.trim(),mode:$('#mode').value,strategy:$('#strategy').value,objective:$('#objective').value};"
          if old not in s: raise SystemExit('discover anchor mismatch')
          s=s.replace(old,new,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.31 Cloud';","const VERSION = 'RADAR v0.4.7.32 Cloud';",1)
          if '<div class="version">v0.4.7.31</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.31</div>','<div class="version">v0.4.7.32</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.32 Cloud","Inserisci il genere musicale prima di avviare RADAR.","const genreValue=genreField.value.trim()","id=\"trackUrl\"","id=\"trackPreview\"","id=\"genre\" value=\"\"","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          forbidden=["stopScan","contact_memory","/api/contact-memory"]
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('unexpected invasive feature '+repr(bad))
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.32 require genre before search" || exit 0
          git push
