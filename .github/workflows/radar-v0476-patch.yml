name: RADAR v0.4.7.19
'on':
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add adaptive contact search
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='\n'.join([
            "  const smartBatches=await Promise.all(queries.map(q=>smartSearch(q,env,input.mode==='complete'?12:10)));",
            "  let results=smartBatches.flatMap(x=>x.results);",
            "  const primaryProviders=unique(smartBatches.map(x=>x.provider).filter(x=>x&&x!=='None'));",
            "  let ev=contactEvidence(results,owner||c.name,c.name);",
            "  let ct=contactabilityFromEvidence(ev);"
          ])
          new='\n'.join([
            "  const firstQueries=input.mode==='complete'?queries:queries.slice(0,2);",
            "  let smartBatches=await Promise.all(firstQueries.map(q=>smartSearch(q,env,input.mode==='complete'?12:10)));",
            "  let results=smartBatches.flatMap(x=>x.results);",
            "  let primaryProviders=unique(smartBatches.map(x=>x.provider).filter(x=>x&&x!=='None'));",
            "  let ev=contactEvidence(results,owner||c.name,c.name);",
            "  let ct=contactabilityFromEvidence(ev);",
            "  const firstStrongest=Math.max(Number(ct.emailConfidence||0),Number(ct.instagramConfidence||0),Number(ct.submissionConfidence||0),Number(ct.siteConfidence||0));",
            "  if(input.mode!=='complete' && ct.contactability<55 && firstStrongest<75 && queries.length>firstQueries.length){",
            "    const extraBatches=await Promise.all(queries.slice(firstQueries.length).map(q=>smartSearch(q,env,10)));",
            "    smartBatches=smartBatches.concat(extraBatches);",
            "    results=results.concat(extraBatches.flatMap(x=>x.results));",
            "    primaryProviders=unique(smartBatches.map(x=>x.provider).filter(x=>x&&x!=='None'));",
            "    ev=contactEvidence(results,owner||c.name,c.name);",
            "    ct=contactabilityFromEvidence(ev);",
            "  }"
          ])
          if old not in s: raise SystemExit('adaptive marker mismatch')
          s=s.replace(old,new,1)
          if "const VERSION = 'RADAR v0.4.7.18 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.18 Cloud';","const VERSION = 'RADAR v0.4.7.19 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.18</div>','<div class="version">v0.4.7.19</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.19 Cloud" worker.js
          grep -q "const firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
          grep -q "ct.contactability<55" worker.js
          grep -q "firstStrongest<75" worker.js
          grep -q "Promise.all(candidates.map" worker.js
          grep -q "opportunityScore" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "contactConfidenceBadge" worker.js
          grep -q "contactEvidence(results,primaryName,playlistName='')" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.19</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.19 adaptive contact search" || exit 0
          git push
