name: RADAR rollback v0.4.7.24
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable worker
        run: |
          git show 1c82b8cd6d7f3745db1814194a55794c4d2e9b85:worker.js > worker.js
      - name: Syntax and canary check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.24 Cloud" worker.js
          grep -q "function updateClock" worker.js
          grep -q "$('#health').addEventListener" worker.js
          grep -q "function priorityOutreach" worker.js
          grep -q "onclick=\"priorityOutreach" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
      - name: Commit rollback
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "Rollback RADAR to stable v0.4.7.24" || exit 0
          git push
