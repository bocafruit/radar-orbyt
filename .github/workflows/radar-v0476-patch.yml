name: RADAR v0.4.7.21
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten outreach priority to visible contacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="function outreachPriority(r){\n  const score=Number(r.opportunityScore||0);\n  const strongest=Math.max(Number(r.emailConfidence||0),Number(r.instagramConfidence||0),Number(r.submissionConfidence||0),Number(r.siteConfidence||0));\n  if(score>=80&&strongest>=75)return{label:'PRIORITÀ OUTREACH',cls:'high'};\n  if(score>=65&&strongest>=50)return{label:'BUONA OPPORTUNITÀ',cls:'medium'};\n  return null;\n}"
          new="function outreachPriority(r){\n  const score=Number(r.opportunityScore||0);\n  const visibleConfidences=[];\n  if(r.email)visibleConfidences.push(Number(r.emailConfidence||0));\n  if(r.instagram)visibleConfidences.push(Number(r.instagramConfidence||0));\n  if(r.submission)visibleConfidences.push(Number(r.submissionConfidence||0));\n  if(r.site)visibleConfidences.push(Number(r.siteConfidence||0));\n  const strongest=visibleConfidences.length?Math.max(...visibleConfidences):0;\n  if(score>=80&&strongest>=75)return{label:'PRIORITÀ OUTREACH',cls:'high'};\n  if(score>=65&&strongest>=50)return{label:'BUONA OPPORTUNITÀ',cls:'medium'};\n  return null;\n}"
          if old not in s: raise SystemExit('outreachPriority marker mismatch')
          s=s.replace(old,new,1)
          if "const VERSION = 'RADAR v0.4.7.20 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.20 Cloud';","const VERSION = 'RADAR v0.4.7.21 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.20</div>','<div class="version">v0.4.7.21</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.21 Cloud" worker.js
          grep -q "const visibleConfidences=\[\]" worker.js
          grep -q "if(r.email)visibleConfidences.push" worker.js
          grep -q "if(r.instagram)visibleConfidences.push" worker.js
          grep -q "if(r.submission)visibleConfidences.push" worker.js
          grep -q "if(r.site)visibleConfidences.push" worker.js
          grep -q "PRIORITÀ OUTREACH" worker.js
          grep -q "BUONA OPPORTUNITÀ" worker.js
          grep -q "opportunityScore" worker.js
          grep -q "firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
          grep -q "Promise.all(candidates.map" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.21</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.21 visible contact priority" || exit 0
          git push
