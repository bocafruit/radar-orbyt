name: RADAR v0.4.7.16
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add owner and playlist evidence boost
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          changes=[
            ("function contactEvidence(results,playlistName){","function contactEvidence(results,primaryName,playlistName=''){"),
            ("  const name=normalize(playlistName), words=name.split(/\\s+/).filter(w=>w.length>=4);","  const name=normalize(primaryName), playlist=normalize(playlistName), words=name.split(/\\s+/).filter(w=>w.length>=4), playlistWords=playlist.split(/\\s+/).filter(w=>w.length>=4);"),
            ("    if(name && text.includes(name)) assoc+=45;\n    const hits=words.filter(w=>text.includes(w)).length;\n    assoc+=Math.min(30,hits*10);\n    if(/spotify|playlist/.test(text)) assoc+=10;","    const ownerExact=!!name&&text.includes(name);\n    const playlistExact=!!playlist&&text.includes(playlist);\n    if(ownerExact)assoc+=45;\n    const hits=words.filter(w=>text.includes(w)).length;\n    assoc+=Math.min(30,hits*10);\n    if(playlistExact)assoc+=25;\n    const playlistHits=playlistWords.filter(w=>text.includes(w)).length;\n    assoc+=Math.min(20,playlistHits*5);\n    if(ownerExact&&playlistExact)assoc+=20;\n    if(/spotify|playlist/.test(text)) assoc+=10;"),
            ("let ev=contactEvidence(results,owner||c.name);","let ev=contactEvidence(results,owner||c.name,c.name);"),
            ("ev=contactEvidence(results,owner||c.name);","ev=contactEvidence(results,owner||c.name,c.name);"),
            ("const VERSION = 'RADAR v0.4.7.15 Cloud';","const VERSION = 'RADAR v0.4.7.16 Cloud';"),
            ('<div class="version">v0.4.7.15</div>','<div class="version">v0.4.7.16</div>')
          ]
          for old,new in changes:
            if old not in s: raise SystemExit('Expected marker missing: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.16 Cloud" worker.js
          grep -q "contactEvidence(results,primaryName,playlistName='')" worker.js
          grep -q "ownerExact&&playlistExact" worker.js
          grep -q "contactEvidence(results,owner||c.name,c.name)" worker.js
          grep -q "contactConfidenceBadge" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.16</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.16 evidence boost" || exit 0
          git push
