name: RADAR v0.4.7.31 manual genre cleanup
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.31 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.30 Cloud';" not in s: raise SystemExit('version mismatch')
          start="const g=$('#genre');let note=$('#genreDetected');if(note)note.remove();if(g&&d.genres&&d.genres.length){"
          i=s.find(start)
          if i<0: raise SystemExit('auto genre start mismatch')
          end="g.parentNode.appendChild(note)}"
          j=s.find(end,i)
          if j<0: raise SystemExit('auto genre end mismatch')
          s=s[:i]+s[j+len(end):]
          listener="const gg=$('#genre');if(gg)gg.addEventListener('input',()=>{gg.dataset.userEdited='1'});"
          if listener not in s: raise SystemExit('genre listener mismatch')
          s=s.replace(listener,'',1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.30 Cloud';","const VERSION = 'RADAR v0.4.7.31 Cloud';",1)
          if '<div class="version">v0.4.7.30</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.30</div>','<div class="version">v0.4.7.31</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.31 Cloud","id=\"trackUrl\"","id=\"trackPreview\"","id=\"genre\" value=\"\"",".field:has(#trackUrl){order:-2}","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          forbidden=["$('#genreDetected')","g.value=detected","Rilevato automaticamente:","dataset.userEdited"]
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('auto genre client remnants '+repr(bad))
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.31 manual genre cleanup" || exit 0
          git push
