name: RADAR v0.4.7.35 safe Track Radar UI shell
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.35 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.34 Cloud';" not in s: raise SystemExit('version mismatch')
          anchor='<section class="panel">\n<div class="grid">'
          shell='<section class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="filterChip" style="cursor:default;border-color:var(--green);color:var(--green)">DISCOVERY RADAR</span><span class="filterChip" style="cursor:default">TRACK RADAR · PROSSIMAMENTE</span></div>\n<div class="grid">'
          if anchor not in s: raise SystemExit('panel anchor mismatch')
          s=s.replace(anchor,shell,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.34 Cloud';","const VERSION = 'RADAR v0.4.7.35 Cloud';",1)
          if '<div class="version">v0.4.7.34</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.34</div>','<div class="version">v0.4.7.35</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Rendered browser syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no rendered scripts')
          rendered='\n;\n'.join(x.replace('\\\\','\\') for x in scripts)
          Path('/tmp/rendered-client.js').write_text(rendered)
          PY
          node --check /tmp/rendered-client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.35 Cloud","DISCOVERY RADAR","TRACK RADAR · PROSSIMAMENTE","id=\"stopScan\" type=\"button\" disabled","stopBtn.disabled=false","stopBtn.disabled=true","new AbortController()","signal:radarAbortController.signal","name==='AbortError'","Inserisci il genere musicale prima di avviare RADAR.","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          forbidden=['/api/contact-memory','trackRadarMode','scanPlacements']
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('unsafe experimental code '+repr(bad))
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.35 safe Track Radar UI shell" || exit 0
          git push
