name: RADAR v0.4.7.26
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean composer UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old='<div><label data-i18n="variables">Variabili rapide</label><div class="tokenRow"><button class="token" data-token="{{curator}}">{{curator}}</button><button class="token" data-token="{{playlist}}">{{playlist}}</button><button class="token" data-token="{{artist}}">{{artist}}</button><button class="token" data-token="{{track}}">{{track}}</button><button class="token" data-token="{{spotify_link}}">{{spotify_link}}</button></div></div>'
          new='<div class="personalizedHint">✦ Personalizzato automaticamente per ogni curatore</div>'
          if old not in s: raise SystemExit('variables block mismatch')
          s=s.replace(old,new,1)
          css='.composeGrid textarea{min-height:170px;resize:vertical;line-height:1.6;font-size:15px;font-weight:400;letter-spacing:0}'
          css2=css+'.personalizedHint{font-size:10px;color:var(--green);letter-spacing:.03em;padding:2px 1px 4px}'
          if css not in s: raise SystemExit('composer css mismatch')
          s=s.replace(css,css2,1)
          open_old="$('#openComposer').addEventListener('click',()=>{$('#composerOverlay').classList.add('open');renderRecipients();setTimeout(()=>$('#senderTrack')?.focus(),80)});"
          open_new="$('#openComposer').addEventListener('click',()=>{const r=[...selectedOutreach.values()][0];if(r){$('#mailSubject').value=fillTemplate('Track submission — {{track}} for {{playlist}}',r);$('#mailBody').value=fillTemplate('Hi {{curator}},\\n\\nI’m {{artist}}. I came across {{playlist}} and thought {{track}} could be a good fit for your audience.\\n\\nHere’s the track: {{spotify_link}}\\n\\nThanks for listening,\\n{{artist}}',r)}$('#composerOverlay').classList.add('open');renderRecipients();setTimeout(()=>$('#senderTrack')?.focus(),80)});"
          if open_old not in s: raise SystemExit('composer open mismatch')
          s=s.replace(open_old,open_new,1)
          if "const VERSION = 'RADAR v0.4.7.25 Cloud';" not in s: raise SystemExit('version mismatch')
          s=s.replace("const VERSION = 'RADAR v0.4.7.25 Cloud';","const VERSION = 'RADAR v0.4.7.26 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.25</div>','<div class="version">v0.4.7.26</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.26 Cloud" worker.js
          grep -q "function updateClock" worker.js
          grep -q "health').addEventListener" worker.js
          grep -q "if(selectedOutreach.has(k))selectedOutreach.delete(k);else selectedOutreach.set(k,r);" worker.js
          grep -q "outreachPriority.selected" worker.js
          grep -q "Personalizzato automaticamente per ogni curatore" worker.js
          grep -q "function fillTemplate" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
          if grep -q '<label data-i18n="variables">Variabili rapide</label>' worker.js; then exit 1; fi
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.26 clean composer preview" || exit 0
          git push
