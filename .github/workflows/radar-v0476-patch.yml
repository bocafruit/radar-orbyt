name: RADAR v0.4.7.24
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade smart outreach composer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old_subject='<input id="mailSubject" value="Music submission for {{playlist}}" />'
          new_subject='<input id="mailSubject" value="Track submission — {{track}} for {{playlist}}" />'
          if old_subject not in s: raise SystemExit('subject marker mismatch')
          s=s.replace(old_subject,new_subject,1)
          old_body='\n'.join([
            '<textarea id="mailBody">Hi {{curator}},',
            '',
            'I’m {{artist}} and I’d love to submit my track {{track}} for consideration on {{playlist}}.',
            '',
            'Listen here: {{spotify_link}}',
            '',
            'Thank you for your time.</textarea>'
          ])
          new_body='\n'.join([
            '<textarea id="mailBody">Hi {{curator}},',
            '',
            'I’m {{artist}}. I came across {{playlist}} and thought {{track}} could be a good fit for your audience.',
            '',
            'Here’s the track: {{spotify_link}}',
            '',
            'Thanks for listening,',
            '{{artist}}</textarea>'
          ])
          if old_body not in s: raise SystemExit('message marker mismatch')
          s=s.replace(old_body,new_body,1)
          old_css='.composeGrid input,.composeGrid textarea{width:100%;border:1px solid #30385f;background:#080c18;color:#fff;border-radius:12px;padding:11px 12px;outline:none}.composeGrid textarea{min-height:170px;resize:vertical;line-height:1.5}'
          new_css='.composeGrid input,.composeGrid textarea{width:100%;border:1px solid #30385f;background:#080c18;color:#fff;border-radius:12px;padding:11px 12px;outline:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.composeGrid textarea{min-height:170px;resize:vertical;line-height:1.6;font-size:15px;font-weight:400;letter-spacing:0}'
          if old_css not in s: raise SystemExit('composer css marker mismatch')
          s=s.replace(old_css,new_css,1)
          old_open="$('#openComposer').addEventListener('click',()=>{$('#composerOverlay').classList.add('open');renderRecipients()});"
          new_open="$('#openComposer').addEventListener('click',()=>{$('#composerOverlay').classList.add('open');renderRecipients();setTimeout(()=>$('#senderTrack')?.focus(),80)});"
          if old_open not in s: raise SystemExit('open composer marker mismatch')
          s=s.replace(old_open,new_open,1)
          if "const VERSION = 'RADAR v0.4.7.23 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.23 Cloud';","const VERSION = 'RADAR v0.4.7.24 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.23</div>','<div class="version">v0.4.7.24</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.24 Cloud" worker.js
          grep -q "Track submission — {{track}} for {{playlist}}" worker.js
          grep -q "could be a good fit for your audience" worker.js
          grep -q "font-family:Inter,ui-sans-serif,system-ui" worker.js
          grep -q "font-size:15px" worker.js
          grep -q "onclick=\\\"priorityOutreach" worker.js
          grep -q "function priorityOutreach" worker.js
          grep -q "firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
          grep -q "Promise.all(candidates.map" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.24</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.24 smart outreach composer" || exit 0
          git push
