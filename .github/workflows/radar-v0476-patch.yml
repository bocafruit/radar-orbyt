name: RADAR v0.4.7.27 artist title and auto genre
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v0.4.7.27 candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker.js'); s=p.read_text()
          if "const VERSION = 'RADAR v0.4.7.26 Cloud';" not in s: raise SystemExit('version mismatch')
          old="const d=await r.json();return json({track:String(d.title||'').trim(),artist:'',image:String(d.thumbnail_url||''),spotifyUrl:clean,trackId:parts[1]})"
          new="const token=await spotifyAccessToken(env);if(!token)return json({error:'Spotify non disponibile'},503);const tr=await fetch('https://api.spotify.com/v1/tracks/'+encodeURIComponent(parts[1]),{headers:{Authorization:'Bearer '+token}});if(!tr.ok)return json({error:'Brano Spotify non trovato'},400);const td=await tr.json();const names=(td.artists||[]).map(a=>a.name).filter(Boolean);let genres=[];const aid=td.artists&&td.artists[0]&&td.artists[0].id;if(aid){try{const ar=await fetch('https://api.spotify.com/v1/artists/'+encodeURIComponent(aid),{headers:{Authorization:'Bearer '+token}});if(ar.ok){const ad=await ar.json();genres=(ad.genres||[]).filter(Boolean).slice(0,4)}}catch(e){}}return json({track:String(td.name||'').trim(),artist:names.join(', '),image:String((td.album&&td.album.images&&td.album.images[0]&&td.album.images[0].url)||d.thumbnail_url||''),spotifyUrl:clean,trackId:parts[1],genres})"
          if old not in s: raise SystemExit('spotify response anchor mismatch')
          s=s.replace(old,new,1)
          oldcard="const a=document.createElement('div');a.textContent=d.artist||'';a.style.cssText='font-size:13px;opacity:.72;margin-top:3px';tx.append(t,a);box.appendChild(tx)"
          newcard="const a=document.createElement('div');a.textContent=d.artist||'';a.style.cssText='font-size:12px;font-weight:800;letter-spacing:.04em;opacity:.82;margin-bottom:3px';tx.append(a,t);box.appendChild(tx);const g=$('#genre');if(g&&d.genres&&d.genres.length){const detected=d.genres[0];if(!g.value.trim())g.value=detected;let note=$('#genreDetected');if(!note){note=document.createElement('div');note.id='genreDetected';note.style.cssText='font-size:11px;color:var(--green);margin-top:6px';g.parentNode.appendChild(note)}note.textContent='Rilevato automaticamente: '+d.genres.join(' · ')}"
          if oldcard not in s: raise SystemExit('track card anchor mismatch')
          s=s.replace(oldcard,newcard,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.26 Cloud';","const VERSION = 'RADAR v0.4.7.27 Cloud';",1)
          if '<div class="version">v0.4.7.26</div>' not in s: raise SystemExit('visible version mismatch')
          s=s.replace('<div class="version">v0.4.7.26</div>','<div class="version">v0.4.7.27</div>',1)
          p.write_text(s)
          PY
      - name: Worker syntax
        run: node --check worker.js
      - name: Browser source syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/client.js
      - name: Critical regression canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          checks=["RADAR v0.4.7.27 Cloud","id=\"trackUrl\"","id=\"trackPreview\"","api.spotify.com/v1/tracks/","api.spotify.com/v1/artists/","Rilevato automaticamente:","tx.append(a,t)","function updateClock","health').addEventListener","spotifySearchPlaylists","outreachPriority.selected","function fillTemplate"]
          miss=[x for x in checks if x not in s]
          if miss: raise SystemExit('missing '+repr(miss))
          print('PASS')
          PY
      - name: Commit candidate to main
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.27 artist title and auto genre" || exit 0
          git push
