name: RADAR v0.4.7.40 wider Track Radar discovery
'on':
  push:
    paths:
      - .github/workflows/radar-v0476-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Track Radar discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          assert "const VERSION = 'RADAR v0.4.7.39 Cloud';" in s
          old="const queries=['\\\"'+track+'\\\" \\\"'+artist+'\\\" site:open.spotify.com/playlist','\\\"'+artist+'\\\" \\\"'+track+'\\\" Spotify playlist'];const batches=await Promise.all(queries.map(q=>smartSearch(q,env,12)));"
          new="const queries=['\\\"'+track+'\\\" \\\"'+artist+'\\\"','\\\"'+track+'\\\" \\\"'+artist+'\\\" Spotify','\\\"'+track+'\\\" \\\"'+artist+'\\\" playlist','site:open.spotify.com/playlist \\\"'+track+'\\\" \\\"'+artist+'\\\"','site:open.spotify.com/playlist '+track+' '+artist];const batches=await Promise.all(queries.map(q=>smartSearch(q,env,20)));"
          assert old in s
          s=s.replace(old,new,1)
          old2="const text=normalize((r.title||'')+' '+(r.description||'')+' '+(r.url||''));if(!text.includes(normalize(track))||!text.includes(normalize(artist)))continue;const clean=cleanPlaylistUrl(r.url||'');if(!clean)continue;"
          new2="const text=normalize((r.title||'')+' '+(r.description||'')+' '+(r.url||''));const clean=cleanPlaylistUrl(r.url||'');if(!clean)continue;if(!text.includes(normalize(track))||!text.includes(normalize(artist)))continue;"
          assert old2 in s
          s=s.replace(old2,new2,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.39 Cloud';","const VERSION = 'RADAR v0.4.7.40 Cloud';",1)
          assert '<div class="version">v0.4.7.39</div>' in s
          s=s.replace('<div class="version">v0.4.7.39</div>','<div class="version">v0.4.7.40</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression canaries
        shell: bash
        run: |
          node --check worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I); assert scripts
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          checks=['RADAR v0.4.7.40 Cloud','smartSearch(q,env,20)',"site:open.spotify.com/playlist",'🟢 CONFERMATO','🟡 PROBABILE','async function trackRadarScan(input,env)',"/api/track-radar",'async function scanTrackRadarPlacements()','function updateClock',"health').addEventListener",'spotifySearchPlaylists','id="stopScan" type="button" disabled']
          missing=[x for x in checks if x not in s]; assert not missing, missing
          PY
          node --check /tmp/client.js
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name bocafruit
          git config user.email chiesastefanojob@gmail.com
          git add worker.js
          git commit -m 'RADAR v0.4.7.40 wider Track Radar discovery' || exit 0
          git push
