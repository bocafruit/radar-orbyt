name: RADAR v0.4.7.42 Spotify targeted discovery
'on':
  push:
    paths:
      - .github/workflows/radar-v0476-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Spotify targeted discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          assert "const VERSION = 'RADAR v0.4.7.41 Cloud';" in s
          old="const queries=['\\\"'+track+'\\\" \\\"'+artist+'\\\"','\\\"'+track+'\\\" \\\"'+artist+'\\\" Spotify','\\\"'+track+'\\\" \\\"'+artist+'\\\" playlist','site:open.spotify.com/playlist \\\"'+track+'\\\" \\\"'+artist+'\\\"','site:open.spotify.com/playlist '+track+' '+artist];const batches=await Promise.all(queries.map(q=>smartSearch(q,env,20)));"
          new="const queries=['open.spotify.com/playlist \\\"'+track+'\\\" \\\"'+artist+'\\\"','Spotify playlist \\\"'+track+'\\\" \\\"'+artist+'\\\"','open.spotify.com \\\"'+track+'\\\" \\\"'+artist+'\\\"','\\\"'+track+'\\\" \\\"'+artist+'\\\" playlist Spotify','\\\"'+track+'\\\" \\\"'+artist+'\\\" open.spotify.com/playlist'];const batches=await Promise.all(queries.map(q=>smartSearch(q,env,30)));"
          assert old in s; s=s.replace(old,new,1)
          old2="const clean=cleanPlaylistUrl(r.url||'');if(!clean)continue;const trackHit=text.includes(normalize(track)),artistHit=text.includes(normalize(artist));"
          new2="let clean=cleanPlaylistUrl(r.url||'');if(!clean){const blob=String((r.title||'')+' '+(r.description||''));const m=blob.match(/https?:\\/\\/open\\.spotify\\.com\\/playlist\\/[A-Za-z0-9]+/i);if(m)clean=cleanPlaylistUrl(m[0])}if(!clean)continue;const trackHit=text.includes(normalize(track)),artistHit=text.includes(normalize(artist));"
          assert old2 in s; s=s.replace(old2,new2,1)
          s=s.replace("const VERSION = 'RADAR v0.4.7.41 Cloud';","const VERSION = 'RADAR v0.4.7.42 Cloud';",1)
          assert '<div class="version">v0.4.7.41</div>' in s
          s=s.replace('<div class="version">v0.4.7.41</div>','<div class="version">v0.4.7.42</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression canaries
        shell: bash
        run: |
          node --check worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('worker.js').read_text(); scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I); assert scripts
          Path('/tmp/client.js').write_text('\n;\n'.join(scripts))
          checks=['RADAR v0.4.7.42 Cloud','smartSearch(q,env,30)','open.spotify.com/playlist','spotifyCandidates','async function trackRadarScan(input,env)',"/api/track-radar",'async function scanTrackRadarPlacements()','function updateClock',"health').addEventListener",'spotifySearchPlaylists','id="stopScan" type="button" disabled']
          missing=[x for x in checks if x not in s]; assert not missing, missing
          PY
          node --check /tmp/client.js
      - name: Commit candidate
        shell: bash
        run: |
          git config user.name bocafruit
          git config user.email chiesastefanojob@gmail.com
          git add worker.js
          git commit -m 'RADAR v0.4.7.42 Spotify targeted discovery' || exit 0
          git push
