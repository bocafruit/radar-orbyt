name: RADAR v0.4.7.12
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Spotify owner verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          marker="async function deepContactForCandidate(c,input,env,allowGoogle=false){"
          helper='\n'.join([
            "let spotifyTokenCache={token:'',expiresAt:0};",
            "",
            "async function spotifyAccessToken(env){",
            "  if(!env.SPOTIFY_CLIENT_ID||!env.SPOTIFY_CLIENT_SECRET)return'';",
            "  if(spotifyTokenCache.token&&Date.now()<spotifyTokenCache.expiresAt-60000)return spotifyTokenCache.token;",
            "  const basic=btoa(env.SPOTIFY_CLIENT_ID+':'+env.SPOTIFY_CLIENT_SECRET);",
            "  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Authorization':'Basic '+basic,'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=client_credentials'});",
            "  if(!r.ok)return'';",
            "  const d=await r.json();",
            "  const token=String(d.access_token||'');",
            "  if(token)spotifyTokenCache={token,expiresAt:Date.now()+Math.max(60,Number(d.expires_in||3600))*1000};",
            "  return token;",
            "}",
            "",
            "async function spotifyPlaylistIdentity(spotifyUrl,env){",
            "  const m=String(spotifyUrl||'').match(/open\\.spotify\\.com\\/playlist\\/([A-Za-z0-9]+)/i);",
            "  if(!m)return null;",
            "  const token=await spotifyAccessToken(env);",
            "  if(!token)return null;",
            "  const u='https://api.spotify.com/v1/playlists/'+encodeURIComponent(m[1])+'?fields=id,name,owner(display_name,id,external_urls),external_urls';",
            "  const r=await fetch(u,{headers:{'Authorization':'Bearer '+token,'Accept':'application/json'}});",
            "  if(!r.ok)return null;",
            "  const d=await r.json();",
            "  return{playlistId:String(d.id||m[1]),name:String(d.name||''),owner:String(d.owner?.display_name||''),ownerId:String(d.owner?.id||''),ownerUrl:String(d.owner?.external_urls?.spotify||''),spotifyVerified:true};",
            "}",
            ""
          ])+'\n'
          if marker not in s: raise SystemExit('deep contact marker not found')
          s=s.replace(marker,helper+marker,1)
          old="  return{result:rescoreContactFirst({...c,...ct,curator:guessCuratorName(c.name,results,c.spotifyUrl),searchSources:unique(primaryProviders.concat(googleUsed?['Google']:[])).join(' + ')||'Search'},input),googleUsed};"
          new="  const spotify=await spotifyPlaylistIdentity(c.spotifyUrl,env).catch(()=>null);\n  const webCurator=guessCuratorName(c.name,results,c.spotifyUrl);\n  const curator=spotify?.owner||webCurator;\n  return{result:rescoreContactFirst({...c,...ct,curator,curatorSource:spotify?.owner?'Spotify':'Web',spotifyOwnerVerified:!!spotify?.owner,spotifyOwnerId:spotify?.ownerId||'',spotifyOwnerUrl:spotify?.ownerUrl||'',spotifyCanonicalName:spotify?.name||'',searchSources:unique(primaryProviders.concat(googleUsed?['Google']:[])).join(' + ')||'Search'},input),googleUsed};"
          if old not in s: raise SystemExit('deep contact return marker not found')
          s=s.replace(old,new,1)
          if "const VERSION = 'RADAR v0.4.7.11 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.11 Cloud';","const VERSION = 'RADAR v0.4.7.12 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.11</div>','<div class="version">v0.4.7.12</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.12 Cloud" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "spotifyOwnerVerified" worker.js
          grep -q '<div class="version">v0.4.7.12</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.12 Spotify owner verification" || exit 0
          git push
