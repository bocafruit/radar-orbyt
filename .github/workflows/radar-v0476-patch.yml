name: RADAR v0.4.7.23
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix priority button click
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          old="+(outreachPriority(r)?'<button class=\"outreachPriority '+outreachPriority(r).cls+'\" data-priority-index=\"'+i+'\">'+outreachPriority(r).label+' →</button>':'')+metaHtml(r)"
          new="+(outreachPriority(r)?'<button type=\"button\" class=\"outreachPriority '+outreachPriority(r).cls+'\" data-priority-index=\"'+i+'\" onclick=\"priorityOutreach(sortedFilteredResults()[Number(this.dataset.priorityIndex)])\">'+outreachPriority(r).label+' →</button>':'')+metaHtml(r)"
          if old not in s: raise SystemExit('priority button marker mismatch')
          s=s.replace(old,new,1)
          old_listener="document.addEventListener('click',e=>{\n  const priority=e.target.closest('[data-priority-index]');\n  if(priority){\n    const shown=sortedFilteredResults();\n    priorityOutreach(shown[Number(priority.dataset.priorityIndex)]);\n    return;\n  }"
          if old_listener in s:
            s=s.replace(old_listener,"document.addEventListener('click',e=>{",1)
          if "const VERSION = 'RADAR v0.4.7.22 Cloud';" not in s: raise SystemExit('version marker missing')
          s=s.replace("const VERSION = 'RADAR v0.4.7.22 Cloud';","const VERSION = 'RADAR v0.4.7.23 Cloud';",1)
          s=s.replace('<div class="version">v0.4.7.22</div>','<div class="version">v0.4.7.23</div>',1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.23 Cloud" worker.js
          grep -q "onclick=\\\"priorityOutreach" worker.js
          grep -q "function priorityOutreach" worker.js
          grep -q "selectedOutreach.set" worker.js
          grep -q "outreachPriority" worker.js
          grep -q "firstQueries=input.mode==='complete'?queries:queries.slice(0,2)" worker.js
          grep -q "Promise.all(candidates.map" worker.js
          grep -q "spotifySearchPlaylists" worker.js
          grep -q "spotifyPlaylistIdentity" worker.js
          grep -q "BRAVE_API_KEY" worker.js
          grep -q "TAVILY_API_KEY" worker.js
          grep -q "SERPAPI_KEY" worker.js
          grep -q '<div class="version">v0.4.7.23</div>' worker.js
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.23 direct outreach click" || exit 0
          git push
