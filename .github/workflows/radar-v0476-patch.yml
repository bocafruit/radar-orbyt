name: RADAR v0.4.7.10
on:
  push:
    paths:
      - '.github/workflows/radar-v0476-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix client regex escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()

          html_start=s.index('const HTML = `')
          html_end=s.index('</script></body></html>`;', html_start)
          head=s[:html_start]
          html=s[html_start:html_end]
          tail=s[html_end:]

          targets={
            ".replace(/\\s+/g,' ')":".replace(/\\\\s+/g,' ')",
            ".replace(/\\s*[-:]\\s*Spotify Playlist.*$/i,'')":".replace(/\\\\s*[-:]\\\\s*Spotify Playlist.*$/i,'')",
            ".replace(/\\s*\\[(?:Submit Music Here|Submit(?: Your)? Music|Playlist Submission)\\].*$/i,'')":".replace(/\\\\s*\\\\[(?:Submit Music Here|Submit(?: Your)? Music|Playlist Submission)\\\\].*$/i,'')",
            ".replace(/\\s*\\((?:Submit Music Here|Submit(?: Your)? Music)\\).*$/i,'')":".replace(/\\\\s*\\\\((?:Submit Music Here|Submit(?: Your)? Music)\\\\).*$/i,'')",
            ".replace(/\\s*[\\|\\u2022]\\s*$/,'')":".replace(/\\\\s*[\\\\|\\\\u2022]\\\\s*$/,'')",
            ".replace(/\\s*[|·]\\s*Spotify\\s*$/i,'')":".replace(/\\\\s*[|·]\\\\s*Spotify\\\\s*$/i,'')",
            ".replace(/\\s*[-–—:]\\s*Spotify\\s*$/i,'')":".replace(/\\\\s*[-–—:]\\\\s*Spotify\\\\s*$/i,'')"
          }
          changed=0
          for old,new in targets.items():
            c=html.count(old)
            if c:
              html=html.replace(old,new)
              changed+=c
          if changed < 3:
            raise SystemExit(f'Expected multiple client regex fixes, got {changed}; refusing unsafe patch')

          old_visible='<div class="version">v0.4.7.4</div>'
          if old_visible in html:
            html=html.replace(old_visible,'<div class="version">v0.4.7.10</div>',1)

          s=head+html+tail
          old_version="const VERSION = 'RADAR v0.4.7.9 Cloud';"
          if old_version not in s:
            raise SystemExit('version target not found; refusing unsafe patch')
          s=s.replace(old_version,"const VERSION = 'RADAR v0.4.7.10 Cloud';",1)
          p.write_text(s)
          PY
      - name: Syntax and regression check
        run: |
          node --check worker.js
          grep -q "RADAR v0.4.7.10 Cloud" worker.js
          grep -q '<div class="version">v0.4.7.10</div>' worker.js
          python - <<'PY'
          from pathlib import Path
          s=Path('worker.js').read_text()
          a=s.index('const HTML = `')
          b=s.index('</script></body></html>`;',a)
          html=s[a:b]
          if "String(d.title||'').replace(/\\\\s+/g,' ').trim()" not in html:
            raise SystemExit('oEmbed whitespace regex is not double-escaped')
          if "replace(/\\\\s+/g,' ').trim()" not in html:
            raise SystemExit('client whitespace regex fix missing')
          PY
      - name: Commit worker
        run: |
          git config user.name "bocafruit"
          git config user.email "chiesastefanojob@gmail.com"
          git add worker.js
          git commit -m "RADAR v0.4.7.10 fix frontend regex escaping" || exit 0
          git push
